name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # master
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # master
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: RSpec
        run: bundle exec rspec

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # master
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update
